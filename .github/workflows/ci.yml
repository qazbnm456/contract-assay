name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # The offline gate: no model, no network, no sandbox runtime, no solc.
    # It must stay fast and deterministic, because a gate that is slow or flaky
    # gets bypassed, and a bypassed gate is the reason broken detectors survive.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy

      - name: Types (tools)
        # `tools/` is outside the package and so outside `packages = [...]`, but
        # it is what built the corpus: `harvest_sherlock.py` reuses one loop
        # variable for `SkipCause` and `NormalizeCause`, which mypy caught and
        # which would have printed one stage's losses under the other's name.
        # A script that produced records is not a scratch file.
        run: mypy tools

      - name: Tests
        run: pytest -m offline --cov=contract_assay --cov-report=term-missing --cov-fail-under=90
      - name: Published result pointers
        # `results/README.md` says "open a pull request with that one file" and
        # nothing checked the file. `load_pointers` is all-or-nothing by design
        # -- a directory that silently drops a result is a comparison over a
        # subset nobody chose -- so one bad merged pointer makes
        # `contract-assay results` exit 1 for every user until somebody reverts
        # it. The gate is where that is caught, on the pull request that adds it.
        run: contract-assay results results

  clean-install:
    # A clean install on a machine whose Python has no CA bundle wired in.
    #
    # `contract-assay fetch` -- the documented first step -- failed on all 141
    # pins after either documented install, because `certifi` was used when
    # importable and never declared. Two earlier reviews found that and fixed
    # the *mypy* consequence twice: every job here is `ubuntu-latest`, where
    # urllib does consult the system store, and the one test that covered the
    # mitigation was an `importorskip` that skipped in exactly the environment
    # where the bug bites. This job is the environment.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install as the docs say
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Fetch the pinned source
        run: contract-assay fetch corpus/records --source-root ./checkout

      - name: The gate, on this platform
        run: pytest -m offline

  figures:
    # The numbers the docstrings publish, checked against a real checkout.
    #
    # Eight review rounds found, every time, a figure re-measured on one side of
    # a comparison and not the other -- a before/after drawn from two submission
    # files, a table mixing two checkouts, an honest ceiling published three
    # ways. The generator was structural: the figures lived in prose and nothing
    # recomputed them. This job is the fix, so a figure that moves fails here
    # instead of waiting for somebody to re-derive it by hand.
    #
    # Separate from `gate` because it needs the network: the checkout is fetched
    # from the coordinates the corpus pins. The offline gate stays offline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Fetch the pinned source
        run: contract-assay fetch corpus/records --source-root ./checkout

      - name: Verify the corpus against it
        # Exits 1 on the shipped corpus: one record pins verified source for a
        # deployed address, which no repository checkout can hold. The gate is
        # that no *new* record joins it, so the count is asserted rather than
        # the exit code.
        run: |
          contract-assay verify corpus/records --source-root ./checkout > verify.txt || true
          cat verify.txt
          grep -q "441 records admitted; 1 of 442" verify.txt

      - name: Published figures
        run: pytest -m checkout
