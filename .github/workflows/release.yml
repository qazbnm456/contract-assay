name: Release

# Publishes on a tag, after **the same gate that guards a commit** has run
# against the artefact that will be uploaded. The first version of this file
# claimed that and did not do it: it installed `pytest` and never called it,
# ran three asserts, and `ci.yml` does not trigger on a tag push at all -- so a
# commit whose tests failed could be tagged and published with a green check.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # As `ci.yml` sets it. Without this the matrix cancels the surviving leg,
      # so a failure on one interpreter hides whether the other would have
      # passed.
      fail-fast: false
      matrix:
        # The same matrix `ci.yml` uses. A release tested on fewer interpreters
        # than the commits it contains is a weaker claim than the commits made.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: The version in the package must be the version in the tag
        # Nothing tied them before. `report/wire.py` writes `__version__` into
        # every score document as `engine_version`, and `engine_version` is one
        # of the fields two published results must agree on -- so a tag ahead of
        # the package would publish documents claiming a version the package
        # does not have, grouping with genuine results of that version. PyPI
        # does not allow re-uploading a version, so the only remedy would be
        # burning one.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/contract_assay/__init__.py)"
          echo "tag=${tagged} package=${declared}"
          test -n "${declared}"
          test "${tagged}" = "${declared}"

      - name: Build the wheel and the sdist
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the built wheel, not the source tree
        # The point of the step. `pip install -e .` proves the repository works;
        # it does not prove the wheel does, and the two differ exactly where a
        # release goes wrong -- a file the package data missed, a module the
        # discovery skipped, `py.typed` absent so a typed consumer cannot import
        # it at all, which this project has shipped once already.
        #
        # No `|| pip install <wheel>` fallback. The earlier one masked the one
        # failure it existed to catch: an extra whose constraint has become
        # unsatisfiable publishes with a green check and a broken `[slither]`.
        # The extra is installed in its own step below, which is allowed to fail
        # loudly without blocking a release that does not depend on it.
        run: |
          set -euo pipefail
          python -m pip install "$(ls dist/*.whl)"
          # The project's own tool *bounds*, not whatever resolves today -- and
          # bounds rather than pins, which is worth saying precisely because the
          # first version of this comment said "pinned". `pyproject.toml`
          # declares `ruff>=0.16.7,<0.17`, so a release can still resolve 0.16.8
          # against a CI run that resolved 0.16.7. What the upper bound buys is
          # that the failure named below cannot happen; what it does not buy is
          # two identical resolutions.
          # `ruff format --check` and new lint rules are version-sensitive, so
          # unpinned tools mean the first ruff 0.17 turns every tagged release
          # red under a check `ci.yml` never applied -- which is not "the same
          # gate", whatever the step is called. A review measured the drift
          # already: the release env resolved ruff 0.16.8 against the project's
          # 0.16.7.
          python -m pip install --group dev

      - name: The gate, against the installed wheel
        # `ruff`, `ruff format --check`, `mypy` and the offline suite with the
        # same coverage floor `ci.yml` applies. Run from the checkout for the
        # tests and the linters, with the *wheel* on `sys.path` rather than the
        # source tree, so what is exercised is what will be uploaded.
        run: |
          set -euo pipefail
          ruff check .
          ruff format --check .
          mypy
          python -m pytest -q -m offline --cov=contract_assay --cov-fail-under=90
          # `ci.yml`'s last step, which this omitted while the header claimed
          # "the same gate that guards a commit". It exits 1 on a malformed
          # published pointer, and nothing else validates `results/`.
          contract-assay results results

      - name: The documented entry points, from the wheel and nowhere near the checkout
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          python - <<'PY'
          from pathlib import Path
          import contract_assay
          assert (Path(contract_assay.__file__).parent / "py.typed").is_file(), "py.typed missing"
          from contract_assay.detectors import API_VERSION, PredicateDetector
          from contract_assay.evidence import Syntax, run_all
          from contract_assay.harness import SourceUnit, run_submission
          from contract_assay.models import Outcome, VulnerabilityClass as V

          class Baseline(PredicateDetector):
              detector_id = "release-smoke"
              class_id = V.ACCESS_CONTROL
              api_version = API_VERSION

          src = "contract V { address o; function setO(address w) external { o = w; } }"
          parsed = Syntax.of(src)
          assert parsed is not None, "the shipped parser could not read a contract"
          refs = run_all(parsed, "V.sol", classes=[V.ACCESS_CONTROL])
          assert refs, "the shipped evidence layer established nothing"
          runs = list(run_submission([Baseline()], [SourceUnit("x", "V.sol", src)]))
          assert len(runs) == 1
          # A finding, not just an evidence item: the earlier gate imported
          # `run_submission` and never called it, while the commit message said
          # it produced a finding.
          assert runs[0].outcome is Outcome.VULNERABLE, runs[0].outcome
          assert runs[0].findings, "the baseline produced no finding from the wheel"
          assert runs[0].produced_without_a_model is True
          print(f"{contract_assay.__version__}: {len(refs)} evidence item(s), "
                f"{len(runs[0].findings)} finding(s)")
          PY
          contract-assay --version

      - name: The slither extra, allowed to fail without blocking the release
        continue-on-error: true
        run: python -m pip install "$(ls dist/*.whl)[slither]"

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # A tag only. `workflow_dispatch` builds and gates from any ref, which is
    # useful; publishing from one is not, and the header comment said "publishes
    # on a tag" while the button published from wherever it was pressed.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted publishing: no token is stored in this repository. A long-lived
    # PyPI token in repository secrets is a credential that outlives every
    # reason it was created for.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
