[project]
name = "contract-assay"
dynamic = ["version"]
description = "Benchmark infrastructure for LLM smart contract auditing: verified findings, deterministic evidence, attributable scoring."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Boik Su" }]
keywords = ["smart-contract", "security", "benchmark", "llm", "solidity", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "pydantic>=2.13,<3",
    "typer>=0.27,<1",
    # The syntactic backend is the analysis floor and the verifier's only way to
    # tell a declaration from a comment mentioning one. It needs no toolchain, so
    # there is no configuration in which it is reasonable to do without it.
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-solidity>=1.2.13,<2",
]

[project.optional-dependencies]
# Primary evidence backend. Needs a resolvable solc per pragma; when it cannot
# compile, the evidence layer degrades to the syntactic tier rather than skipping.
slither = [
    "slither-analyzer>=0.11.6,<0.12",
    "crytic-compile>=0.4.2,<0.5",
]
all = ["contract-assay[slither]"]

# There is no `llm` extra, and the omission is deliberate. This package imports
# no model library: `Detector.plan()` states what to ask and nothing here asks
# it, because an instrument whose correctness depended on the thing it measures
# could not tell a broken instrument from a weak model. What a consumer needs to
# call a model is in `examples/reference_runner/requirements.txt`, which is
# where a dependency nothing here imports belongs.

[project.scripts]
contract-assay = "contract_assay.cli:app"

[project.urls]
Repository = "https://github.com/qazbnm456/contract-assay"

[dependency-groups]
# Development tooling is NOT a runtime dependency. Shipping a formatter in
# [project.dependencies] installs it for every consumer and still enforces
# nothing; enforcement lives in CI (.github/workflows/ci.yml).
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=5",
    "ruff>=0.16.7,<0.17",
    "mypy>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_assay"]
# PEP 561. Without the marker a consumer running strict mypy cannot import this
# package at all -- it reports "missing library stubs or py.typed marker" and
# stops. Found by building a consumer: this project runs mypy over its own
# source, where the marker is never consulted, so the gate here could not see
# it. A benchmark meant to be depended on has to be importable by a typed
# caller, and that is a packaging property rather than a code one.
artifacts = ["src/contract_assay/py.typed"]

# ---------------------------------------------------------------------------
# Enforcement. Every tool below runs in CI on every push. A linter that is
# configured but never run is decoration; the gate is what makes it real.
# ---------------------------------------------------------------------------

[tool.hatch.version]
# One literal, in the package. A second copy here would drift, and the version
# is written into every score document as `engine_version`.
path = "src/contract_assay/__init__.py"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort — import order is enforced, not conventional
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "PTH",      # use pathlib over os.path
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["contract_assay"]

[[tool.mypy.overrides]]
# `certifi` is a genuinely optional import, guarded by `try/except ImportError`
# in `corpus/fetch.py` -- present on most machines because something else pulled
# it in, absent in a clean install of this package. It was absent from both the
# dependencies and these overrides, so `mypy` failed in a clean environment and
# passed locally: `ci.yml`'s type step was red on every push and the release
# gate could never reach `publish`. Found by review in a venv built verbatim
# from the workflow, which is the only way that class of defect is found.
module = ["certifi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Third-party analysis backends ship no type information. `dspy` and
# `rlm_harness` appear only in `examples/`, which is not part of the package.
module = ["dspy.*", "rlm_harness.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Third-party analysis backends ship no type information.
module = ["slither.*", "crytic_compile.*", "tree_sitter.*", "tree_sitter_solidity.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "offline: runs with no model, no network, and no sandbox runtime",
    "live: requires a configured LM; excluded from the default CI gate",
    "solc: requires a resolvable solc toolchain",
    "checkout: needs a source checkout built by `contract-assay fetch`",
]
